# One pnpm "family": every folder below is its own package, installed together from the root
# with a single lock file (pnpm-lock.yaml).
packages:
  - apps/*
  - packages/*

# Packages allowed to run install scripts. Approve a new one with `pnpm approve-builds <pkg>`.
allowBuilds:
  esbuild: true
  argon2: true
  # An optional native speed-up for BullMQ's message encoding. BullMQ works without it
  # (plain JavaScript fallback), so its install script is not run.
  msgpackr-extract: false
