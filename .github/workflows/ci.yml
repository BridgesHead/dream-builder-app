# CI for the whole monorepo (BE-01). Runs on every pull request and on pushes to the main branches.
# Turborepo runs lint, typecheck, tests and build for every app and package that has that script.
name: CI

on:
  pull_request:
  push:
    branches: [dev, stage, main]

jobs:
  check:
    name: Lint, typecheck, tests and build
    runs-on: ubuntu-latest

    # Throwaway databases just for this run: MongoDB (the "test database") and Redis for the
    # BullMQ job queue (BE-07), so CI tests the real queue, including a worker that crashes mid-job.
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/dream_builder_test
      REDIS_URL: redis://127.0.0.1:6379
      TURBO_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests (unit and integration)
        run: pnpm test

      - name: Build
        run: pnpm build

      # The generated API types must match openapi.yaml. If this fails, run `pnpm contracts`
      # and commit packages/api-types/src/generated.
      - name: Generated API types are up to date
        run: git diff --exit-code packages/api-types/src/generated

  # Fails if a password, API key or other secret is found anywhere in the repo's history.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the full history, so old commits are scanned too

      - name: Run gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 detect --source /repo --redact --verbose
