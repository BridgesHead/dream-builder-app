# Deploy the API + worker to AWS (backend guide AWS-01 / AWS-02).
#
#   merge to main        -> build the image once, deploy it to staging automatically
#   push a tag v1.2.3    -> deploy THAT SAME image to production, after Sami approves
#                           (required reviewer on the GitHub "production" environment)
#
# Production never builds: it promotes the image staging already ran for that commit.
# Tag only commits that reached staging through main.
#
# The image (apps/api/Dockerfile) is built for linux/arm64 (Graviton) and pushed to ECR,
# then the server is told through AWS Systems Manager to run /opt/dreambuilder/deploy.sh.
# deploy.sh reads the settings from Parameter Store and rolls back if the API is unhealthy.
# No AWS keys are stored in GitHub: each environment logs in with OIDC to its own role,
# which can only deploy to its own server.
#
# Per GitHub environment (Settings > Environments > staging / production > Variables):
#   AWS_DEPLOY_ROLE_ARN, EC2_INSTANCE_ID   (printed by infra/aws/setup-iam.sh)
# When a dev server exists (AWS-01), add a "dev" environment and a deploy-dev job like staging's.
name: Deploy API

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths: # branch pushes only; tag pushes always run
      - "apps/api/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".dockerignore"
      - ".github/workflows/deploy-api.yml"
      - ".github/workflows/ssm-deploy.sh"
  workflow_dispatch: # re-deploy main to staging by hand

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1 # Mumbai for now; me-central-1 (UAE) once AWS restores that region
  ECR_REPOSITORY: dreambuilder-backend

jobs:
  staging:
    name: Build and deploy to staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    concurrency: { group: deploy-staging, cancel-in-progress: false }
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and push the image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on the staging server
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ github.sha }}
        run: bash .github/workflows/ssm-deploy.sh

  production:
    name: Promote to production
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production # waits here for Sami's approval
    concurrency: { group: deploy-production, cancel-in-progress: false }
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check this commit's image exists (it ran on staging)
        run: |
          if ! aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "::error::No image for ${GITHUB_SHA::7}. Tag a commit that was merged to main and deployed to staging."
            exit 1
          fi
          echo "Promoting image ${GITHUB_SHA::7} (tag ${GITHUB_REF_NAME})"

      - name: Deploy on the production server
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ github.sha }}
        run: bash .github/workflows/ssm-deploy.sh
