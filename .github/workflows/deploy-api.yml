# Deploy the app to AWS (backend guide AWS-01 / AWS-02): the API + worker, and the frontend.
#
#   merge to main        -> build the images once, deploy them to staging automatically
#   push a tag v1.2.3    -> deploy THOSE SAME images to production, after Sami approves
#                           (required reviewer on the GitHub "production" environment)
#
# Production never builds: it promotes the images staging already ran for that commit.
# Tag only commits that reached staging through main.
#
# Two images per commit, both for linux/arm64 (Graviton), in the same ECR repository:
#   <commit>       the API + worker (apps/api/Dockerfile)
#   web-<commit>   the frontend, served at / on the same address as the API (apps/web/Dockerfile)
# Then the server is told through AWS Systems Manager to run /opt/dreambuilder/deploy.sh.
# deploy.sh reads the settings from Parameter Store and rolls back if the API is unhealthy
# or the frontend does not start.
# No AWS keys are stored in GitHub: each environment logs in with OIDC to its own role,
# which can only deploy to its own server.
#
# Per GitHub environment (Settings > Environments > staging / production > Variables):
#   AWS_DEPLOY_ROLE_ARN, EC2_INSTANCE_ID   (printed by infra/aws/setup-iam.sh)
# When a dev server exists (AWS-01), add a "dev" environment and a deploy-dev job like staging's.
name: Deploy API

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths: # branch pushes only; tag pushes always run
      - "apps/api/**"
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".dockerignore"
      - ".github/workflows/deploy-api.yml"
      - ".github/workflows/ssm-deploy.sh"
  workflow_dispatch: # re-deploy main to staging by hand

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1 # Mumbai for now; me-central-1 (UAE) once AWS restores that region
  ECR_REPOSITORY: dreambuilder-backend

jobs:
  staging:
    name: Build and deploy to staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    concurrency: { group: deploy-staging, cancel-in-progress: false }
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and push the API image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the frontend image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:web-${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Deploy on the staging server
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ github.sha }}
        run: bash .github/workflows/ssm-deploy.sh

  production:
    name: Promote to production
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production # waits here for Sami's approval
    concurrency: { group: deploy-production, cancel-in-progress: false }
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check this commit's images exist (they ran on staging)
        run: |
          for tag in "$GITHUB_SHA" "web-$GITHUB_SHA"; do
            if ! aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
                 --image-ids imageTag="$tag" >/dev/null 2>&1; then
              echo "::error::No image $tag. Tag a commit that was merged to main and deployed to staging."
              exit 1
            fi
          done
          echo "Promoting images for ${GITHUB_SHA::7} (tag ${GITHUB_REF_NAME})"

      - name: Deploy on the production server
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ github.sha }}
        run: bash .github/workflows/ssm-deploy.sh
